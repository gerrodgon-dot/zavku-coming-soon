alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
domains:
- domain: zavku.com
  type: PRIMARY
features:
- buildpack-stack=ubuntu-22
ingress:
  rules:
  - component:
      name: zavku-contact
      preserve_path_prefix: true
    match:
      path:
        prefix: /api
  - component:
      name: zavku-coming-soon
    match:
      authority:
        exact: ""
      path:
        prefix: /
name: seahorse-app
region: atl
static_sites:
- environment_slug: html
  github:
    branch: block-00-institutional
    deploy_on_push: true
    repo: gerrodgon-dot/zavku-coming-soon
  name: zavku-coming-soon
  source_dir: /site
  output_dir: /
  index_document: index.html
  error_document: 404.html
services:
- name: zavku-contact
  github:
    branch: block-00-institutional
    deploy_on_push: true
    repo: gerrodgon-dot/zavku-coming-soon
  source_dir: /
  dockerfile_path: Dockerfile.contact
  http_port: 8080
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-0.5gb
  health_check:
    http_path: /health
  envs:
  - key: SITE_ORIGIN
    scope: RUN_TIME
    value: https://zavku.com
  - key: TRUST_DO_INGRESS
    scope: RUN_TIME
    value: "true"
  - key: CONTACT_DELIVERY_ENABLED
    scope: RUN_TIME
    value: "false"
